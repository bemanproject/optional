# $schema: https://mrdocs.com/docs/mrdocs/develop/_attachments/mrdocs.schema.json
# yaml-language-server: $schema=https://mrdocs.com/docs/mrdocs/develop/_attachments/mrdocs.schema.json

---
source-root: ..
input:
  - ../include
exclude:
  - ../include/beman/optional/detail
exclude-patterns:
  - ../include/beman/optional/detail/**
  - ../tests/**
  - ../examples/**
includes:
  - ../include
file-patterns:
  - '*.hpp'
include-symbols:
  - 'beman::optional::**'
implementation-defined:
  - 'beman::optional::detail'
multipage: true
generator: adoc
output: modules/ROOT/pages/reference
extract-private: false
cmake: '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DOPTIONAL_ENABLE_TESTING=OFF'
base-url: https://github.com/bemanproject/optional/blob/main/
