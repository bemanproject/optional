# SPDX-License-Identifier: Apache-2.0 WITH LLVM-exception

name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed for gh-pages deploy on main

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 libclang-18-dev

      - name: Cache MrDocs
        uses: actions/cache@v4
        with:
          path: .tools/mrdocs
          key: mrdocs-${{ runner.os }}-${{ hashFiles('etc/install-mrdocs.sh') }}

      - name: Build documentation
        run: make docs

      - name: Locate output directory
        id: out
        run: echo "dir=$(make -s print-docs-out)" >> "$GITHUB_OUTPUT"

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: ${{ steps.out.outputs.dir }}/
          retention-days: 14

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.out.outputs.dir }}
          publish_branch: gh-pages
